
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff0f6">
<title>Member Room ♡</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --pink: #ef9fc5;
  --dark-pink: #b96d91;
  --cream: #fff7f5;
  --text: #966d7d;
}

body {
  margin: 0;
  padding: 0 15px 82px;
  min-height: 100svh;
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN", sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at 50% 20%, #fffdfb, transparent 65%),
    linear-gradient(145deg, #ffe5f0, #fff6f4 55%, #fceafa);
  overflow-x: hidden;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  position: relative;
}

/* 上部の雲形フリル */

.cloud-frill {
  position: absolute;
  top: 0;
  left: -25px;
  right: -25px;
  height: 55px;
  background:
    radial-gradient(ellipse 45px 35px at 45px 0, #f9c8df 95%, transparent),
    radial-gradient(ellipse 55px 42px at 125px 0, #f9c8df 95%, transparent),
    radial-gradient(ellipse 55px 42px at 220px 0, #f9c8df 95%, transparent),
    radial-gradient(ellipse 55px 42px at 320px 0, #f9c8df 95%, transparent),
    radial-gradient(ellipse 55px 42px at 420px 0, #f9c8df 95%, transparent);
  background-size: 520px 65px;
  background-color: #f9c8df;
  border-radius: 0 0 45% 45%;
  box-shadow: 0 5px 12px #d98eae55;
  z-index: 0;
}

/* 飾り */

.decoration {
  position: absolute;
  z-index: 1;
  pointer-events: none;
  filter: drop-shadow(0 5px 5px #d68eaa55);
}

.ribbon {
  top: 23px;
  left: 2px;
  font-size: 65px;
  transform: rotate(-12deg);
}

.heart-one {
  top: 85px;
  right: 0;
  font-size: 35px;
}

.heart-two {
  top: 165px;
  left: -7px;
  font-size: 28px;
}

.heart-three {
  top: 190px;
  right: 8px;
  font-size: 28px;
}

/* タイトル */

header {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 35px 5px 8px;
}

.crown {
  font-size: 34px;
  line-height: 1;
  filter: drop-shadow(0 4px 3px #d99c4266);
}

header h1 {
  font-size: clamp(29px, 7vw, 37px);
  font-weight: 900;
  letter-spacing: -1px;
  margin: 2px 0 6px;
  color: #ed83b2;
  text-shadow:
    0 3px 0 #fff,
    0 5px 5px #c76e9a66;
}

.subtitle {
  display: inline-block;
  padding: 6px 18px;
  border-radius: 30px;
  background: linear-gradient(180deg, #fffaff, #f7c9df);
  border: 2px solid #f9d9e9;
  box-shadow: 0 5px 8px #c982a344,
              inset 0 3px 5px #ffffff;
  font-size: 13px;
  font-weight: bold;
  color: #a85e83;
}

.crown {
  font-size: 43px;
  line-height: 1;
  filter: drop-shadow(0 4px 3px #d99c4266);
}

header h1 {
  font-size: clamp(32px, 8vw, 43px);
  font-weight: 900;
  letter-spacing: -1px;
  margin: 2px 0 9px;
  color: #ed83b2;
  text-shadow:
    0 3px 0 #fff,
    0 5px 5px #c76e9a66;
}

.subtitle {
  display: inline-block;
  padding: 8px 24px;
  border-radius: 30px;
  background: linear-gradient(180deg, #fffaff, #f7c9df);
  border: 2px solid #f9d9e9;
  box-shadow: 0 5px 8px #c982a344,
              inset 0 3px 5px #ffffff;
  font-size: 15px;
  font-weight: bold;
  color: #a85e83;
}

/* 人数表示 */

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 5px 0 10px;
}

.stat {
  min-height: 78px;
  border-radius: 23px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 5px;
  box-shadow:
    0 8px 12px #b77e9940,
    inset 0 4px 7px #ffffffcc,
    inset 0 -5px 8px #0000000c;
  border: 2px solid #ffffffa8;
}

.stat.green {
  background: linear-gradient(145deg, #d6fff0, #8de5c2);
}

.stat.pink {
  background: linear-gradient(145deg, #ffe1ed, #f5a9c5);
}

.stat-icon {
  font-size: 42px;
  filter: drop-shadow(0 4px 3px #9a718044);
}

.stat-info {
  text-align: center;
}

.stat-number {
  font-size: 39px;
  line-height: 1.1;
  font-weight: 900;
  color: #299d7c;
  text-shadow: 0 2px #ffffffaa;
}

.pink .stat-number {
  color: #d875a0;
}

.stat-label {
  font-size: 13px;
  font-weight: bold;
  margin-top: 6px;
}

/* メニュー */

.section-title {
  text-align: center;
  color: #bd7896;
  font-size: 15px;
  font-weight: 900;
  margin: 7px 0 7px;
}

.menu-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.menu-button {
  min-width: 0;
  min-height: 91px;
  padding: 6px 3px;
  border: 2px solid #ffffffb8;
  border-radius: 21px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: #956879;
  font-family: inherit;
  font-size: 14px;
  font-weight: 900;
  box-shadow:
    0 8px 12px #b77e9935,
    inset 0 5px 8px #ffffffc9,
    inset 0 -5px 8px #0000000c;
  cursor: pointer;
  transition: transform .15s;
}

.menu-button:active {
  transform: scale(.96);
}

.menu-icon {
  font-size: 34px;
  line-height: 1.1;
  filter: drop-shadow(0 4px 3px #98718b44);
}

.menu-button span:last-child {
  white-space: nowrap;
}

.menu-pink {
  background: linear-gradient(145deg, #ffd8ee, #f29acb);
}

.menu-green {
  background: linear-gradient(145deg, #dcfff0, #9be9c8);
}

.menu-yellow {
  background: linear-gradient(145deg, #fff3bd, #ffd96f);
}

.menu-blue {
  background: linear-gradient(145deg, #d9f2ff, #a0d7f7);
}

.menu-purple {
  background: linear-gradient(145deg, #f0e2ff, #c9a9ef);
}

.menu-orange {
  background: linear-gradient(145deg, #ffe0c9, #ffb58e);
}

/* 最近の登録 */

.recent {
  margin: 12px 0 8px;
  position: relative;
  padding-top: 10px;
}

.recent-title {
  position: relative;
  z-index: 1;
  width: 72%;
  margin: auto;
  text-align: center;
  padding: 7px 8px;
  border-radius: 25px;
  background: linear-gradient(180deg, #fff, #f9d8e8);
  border: 2px solid #ffffff;
  box-shadow: 0 4px 7px #bd819a44;
  font-size: 16px;
  font-weight: 900;
  color: #b96f91;
}

.recent-content {
  min-height: 65px;
  margin-top: -6px;
  border-radius: 25px;
  border: 2px solid #ffffff;
  background: linear-gradient(145deg, #fffdfd, #fff0f5);
  box-shadow:
    0 7px 12px #c68da044,
    inset 0 4px 8px #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px 10px;
  text-align: center;
}

.empty-message {
  font-size: 18px;
  font-weight: bold;
  color: #c17e9d;
}

/* 下部ナビ */

.bottom-nav {
  position: fixed;
  z-index: 10;
  bottom: 6px;
  left: 10px;
  right: 10px;
  max-width: 520px;
  margin: auto;
  height: 65px;
  border-radius: 25px;
  border: 2px solid #ffffff;
  background: linear-gradient(145deg, #fff9fc, #f7d4e7);
  box-shadow:
    0 7px 16px #b97b9c55,
    inset 0 4px 8px #ffffff;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}

.nav-button {
  border: none;
  background: transparent;
  color: #b96d91;
  font-family: inherit;
  font-weight: bold;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
}

.nav-button + .nav-button {
  border-left: 2px solid #edc1d7;
}

.nav-icon {
  font-size: 25px;
  filter: drop-shadow(0 3px 3px #ba779644);
}

footer {
  text-align: center;
  font-size: 11px;
  color: #c79bad;
  margin: 20px 0;
}

@media (max-width: 390px) {
  body {
    padding-left: 10px;
    padding-right: 10px;
  }

  .menu-grid {
    gap: 7px;
  }

  .menu-button {
    min-height: 85px;
    font-size: 12px;
  }

  .menu-icon {
    font-size: 30px;
  }

  .stat-icon {
    font-size: 30px;
  }

  .stat-number {
    font-size: 32px;
  }
}
/* 新規登録画面 */
#registerScreen {
  padding: 15px 5px 100px;
}

#registerScreen h2 {
  color: #d979a5;
  text-align: center;
  font-size: 23px;
  margin: 22px 0 8px;
}

#registerScreen p {
  color: #a77b91;
  text-align: center;
  font-size: 13px;
  margin-bottom: 25px;
}

#backHomeButton {
  background: #fff;
  color: #d979a5;
  border: 2px solid #f5c5da;
  border-radius: 20px;
  padding: 10px 17px;
  font-size: 13px;
  font-weight: bold;
  box-shadow: 0 3px 7px #e9b9cd;
}

.form-group {
  background: #fff9fc;
  border: 2px solid #f7d5e4;
  border-radius: 20px;
  padding: 14px;
  margin: 13px 0;
  box-shadow: 0 4px 9px #f3dce7;
}

.form-group label {
  display: block;
  color: #b96f91;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 9px;
}

.form-group input {
  width: 100%;
  box-sizing: border-box;
  border: 2px solid #f4d5e2;
  border-radius: 13px;
  background: #fff;
  padding: 12px;
  font-size: 16px;
  color: #775568;
  outline: none;
}

.form-group input:focus {
  border-color: #e9a8c5;
  box-shadow: 0 0 0 3px #fce8f1;
}
/* 日付入力欄のはみ出し防止 */
.form-group input[type="date"] {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  box-sizing: border-box;
  padding: 10px 4px;
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}
.form-group select,
.form-group textarea {
  width: 100%;
  box-sizing: border-box;
  border: 2px solid #f4d5e2;
  border-radius: 13px;
  background: #fff;
  padding: 12px;
  font-size: 15px;
  color: #775568;
  outline: none;
  font-family: inherit;
}

.form-group select:focus,
.form-group textarea:focus {
  border-color: #e9a8c5;
  box-shadow: 0 0 0 3px #fce8f1;
}

.form-group textarea {
  resize: vertical;
  min-height: 90px;
}
/* 入力内容の確認画面 */
#confirmScreen {
  padding: 15px 5px 100px;
}

#confirmScreen h2 {
  color: #d979a5;
  text-align: center;
  font-size: 23px;
  margin: 22px 0 8px;
}

#confirmScreen p {
  color: #a77b91;
  text-align: center;
  font-size: 13px;
  margin-bottom: 25px;
}

/* 確認画面の戻るボタン */
#backRegisterButton,
#editRegisterButton {
  background: #fff;
  color: #d979a5;
  border: 2px solid #f5c5da;
  border-radius: 20px;
  padding: 12px 18px;
  font-size: 14px;
  font-weight: bold;
  box-shadow: 0 3px 7px #e9b9cd;
}

/* 登録確定ボタン */
#submitRegisterButton {
  display: block;
  width: 100%;
  margin-top: 18px;
  padding: 16px 10px;
  background: linear-gradient(135deg, #f6b8d2, #e995bb);
  color: #fff;
  border: none;
  border-radius: 20px;
  font-size: 16px;
  font-weight: bold;
  box-shadow: 0 4px 9px #e9b9cd;
}
/* 確認画面の入力内容カード */
.confirm-item {
  background: #fff9fc;
  border: 2px solid #f7d5e4;
  border-radius: 17px;
  padding: 13px 15px;
  margin: 10px 0;
  box-shadow: 0 3px 7px #f3dce7;
}

.confirm-item strong {
  display: block;
  color: #b96f91;
  font-size: 13px;
  margin-bottom: 7px;
}

.confirm-item p {
  color: #775568 !important;
  text-align: left !important;
  font-size: 15px !important;
  margin: 0 !important;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
/* 確認画面を2列にする */
#confirmContent {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

/* 確認カードの余白調整 */
#confirmContent .confirm-item {
  margin: 0;
  padding: 12px 10px;
  min-width: 0;
}

/* メモ・備考だけ横幅いっぱい */
#confirmContent .confirm-item:last-child {
  grid-column: 1 / -1;
}
/* 確認画面へ進むボタン */
#goConfirmButton {
  display: block;
  width: 100%;
  margin: 22px 0;
  padding: 16px 10px;
  background: linear-gradient(135deg, #f6b8d2, #e995bb);
  color: #fff;
  border: none;
  border-radius: 20px;
  font-size: 16px;
  font-weight: bold;
  box-shadow: 0 4px 9px #e9b9cd;
}
</style>
</head>

<body>

<div class="container">
<div id="homeScreen">
  <div class="cloud-frill"></div>

  <div class="decoration ribbon">🎀</div>
  <div class="decoration heart-one">💛</div>
  <div class="decoration heart-two">💗</div>
  <div class="decoration heart-three">💗</div>

  <header>
    <div class="crown">👑</div>
    <h1>Member Room</h1>
    <div class="subtitle">💗 メンバー募集管理 💗</div>
  </header>

  <!-- 人数表示 -->

  <section class="stats">

    <div class="stat green">
      <div class="stat-icon">👥</div>
      <div class="stat-info">
        <div class="stat-number" id="totalCount">0</div>
        <div class="stat-label">登録人数</div>
      </div>
    </div>

    <div class="stat pink">
      <div class="stat-icon">💭</div>
      <div class="stat-info">
        <div class="stat-number" id="pendingCount">0</div>
        <div class="stat-label">検討中</div>
      </div>
    </div>

  </section>

  <!-- 6つのメニュー -->

  <h2 class="section-title">♡ MENU ♡</h2>

  <section class="menu-grid">

    <button class="menu-button menu-pink" type="button">
      <span class="menu-icon">📝</span>
      <span>検索</span>
    </button>

    <button id="newRegisterButton" class="menu-button menu-green" type="button">
      <span class="menu-icon">📅</span>
      <span>新規登録</span>
    </button>

    <button class="menu-button menu-yellow" type="button">
      <span class="menu-icon">🔍</span>
      <span>編集</span>
    </button>

    <button class="menu-button menu-blue" type="button">
      <span class="menu-icon">💗</span>
      <span>参加状況</span>
    </button>

    <button class="menu-button menu-purple" type="button">
      <span class="menu-icon">🔗</span>
      <span>リンク対応</span>
    </button>

    <button class="menu-button menu-orange" type="button">
      <span class="menu-icon">📒</span>
      <span>ちびメモ</span>
    </button>

  </section>

  <!-- 最近の登録 -->

  <section class="recent">

    <div class="recent-title">
      💗 最近の登録 💗
    </div>

    <div class="recent-content">
      <div class="empty-message">
        まだ登録されていません ♡
      </div>
    </div>

  </section>

  <footer>
    Member Room ♡
  </footer>
</div>
<section id="registerScreen" style="display:none;">

  <button id="backHomeButton" type="button">
    ♡ ホームに戻る
  </button>

  <h2>💗 新規登録 💗</h2>
  <p>新しいメンバーの情報を登録します♡</p>

  <div class="form-group">
    <label for="contactDate">📅 声かけ日 *</label>
    <input
      type="date"
      id="contactDate"
      required
    >
  </div>

  <div class="form-group">
    <label for="xAccount">𝕏 Xアカウント</label>
    <input
      type="text"
      id="xAccount"
      placeholder="例：@xxxxx"
    >
  </div>

  <div class="form-group">
    <label for="memberName">💗 お名前 *</label>
    <input
      type="text"
      id="memberName"
      placeholder="お名前を入力してください"
      required
    >
  </div>
  <div class="form-group">
    <label for="activityStatus">🌷 現在の活動状況</label>
    <select id="activityStatus">
      <option value="">選択してください</option>
      <option value="個人で売り">個人で売り</option>
      <option value="個人でイベント参加">個人でイベント参加</option>
      <option value="他チーム所属">他チーム所属</option>
      <option value="未経験">未経験</option>
      <option value="その他・不明">その他・不明</option>
    </select>
  </div>

  <div class="form-group">
    <label for="accountCount">🎀 持ち垢数</label>
    <input
      type="number"
      id="accountCount"
      min="0"
      step="1"
      placeholder="例：5"
    >
  </div>

  <div class="form-group">
    <label for="linkAccountCount">💗 リンク対応垢数</label>
    <input
      type="number"
      id="linkAccountCount"
      min="0"
      step="1"
      placeholder="例：3"
    >
  </div>
  <div class="form-group">
    <label for="participationStatus">💌 参加状況</label>
    <select id="participationStatus">
      <option value="">選択してください</option>
      <option value="返事待ち">返事待ち</option>
      <option value="検討中">検討中</option>
      <option value="前向き">前向き</option>
      <option value="参加確定">参加確定</option>
      <option value="辞退">辞退</option>
      <option value="不明">不明</option>
    </select>
  </div>

  <div class="form-group">
    <label for="lastContactDate">📅 最終連絡日</label>
    <input
      type="date"
      id="lastContactDate"
    >
  </div>

  <div class="form-group">
    <label for="nextContactDate">🌸 次回声かけ予定日</label>
    <input
      type="date"
      id="nextContactDate"
    >
  </div>

  <div class="form-group">
    <label for="memberMemo">📝 メモ・備考</label>
    <textarea
      id="memberMemo"
      rows="4"
      placeholder="気になることや連絡内容などを入力できます♡"
    ></textarea>
  </div>
  <button id="goConfirmButton" type="button">
    💗 入力内容を確認する
  </button>
</section>
  <!-- 入力内容の確認画面 -->
<section id="confirmScreen" style="display:none;">

  <button id="backRegisterButton" type="button">
    ♡ 入力画面に戻る
  </button>

  <h2>💗 登録内容の確認 💗</h2>

  <p>入力した内容に間違いがないか確認してください♡</p>

  <div id="confirmContent">
    <!-- 入力内容をここに表示します -->
  </div>

  <button id="editRegisterButton" type="button">
    ♡ 修正する
  </button>

  <button id="submitRegisterButton" type="button">
    💗 この内容で登録する
  </button>

</section>
</div>

<!-- 下部ナビゲーション -->

<nav class="bottom-nav">

  <button class="nav-button" type="button">
    <span class="nav-icon">🏠</span>
    <span>ホーム</span>
  </button>

  <button class="nav-button" type="button">
    <span class="nav-icon">☷</span>
    <span>一覧</span>
  </button>

  <button class="nav-button" type="button">
    <span class="nav-icon">📋</span>
    <span>出力</span>
  </button>

</nav>
<script>
const homeScreen = document.getElementById('homeScreen');
const registerScreen = document.getElementById('registerScreen');
const newRegisterButton = document.getElementById('newRegisterButton');
const backHomeButton = document.getElementById('backHomeButton');
// 確認画面の要素
const confirmScreen = document.getElementById('confirmScreen');
const backRegisterButton = document.getElementById('backRegisterButton');
const editRegisterButton = document.getElementById('editRegisterButton');
const submitRegisterButton = document.getElementById('submitRegisterButton');
const confirmContent = document.getElementById('confirmContent');

// 入力画面の要素
const registerInputs = {
  contactDate: document.getElementById('contactDate'),
  xAccount: document.getElementById('xAccount'),
  memberName: document.getElementById('memberName'),
  activityStatus: document.getElementById('activityStatus'),
  accountCount: document.getElementById('accountCount'),
  linkAccountCount: document.getElementById('linkAccountCount'),
  participationStatus: document.getElementById('participationStatus'),
  lastContactDate: document.getElementById('lastContactDate'),
  nextContactDate: document.getElementById('nextContactDate'),
  memberMemo: document.getElementById('memberMemo')
};
  // 確認画面に入力内容を表示する
function showConfirmContent() {

  const labels = {
    contactDate: '📅 声かけ日',
    xAccount: '𝕏 Xアカウント',
    memberName: '💗 お名前',
    activityStatus: '🌷 現在の活動状況',
    accountCount: '🎀 持ち垢数',
    linkAccountCount: '💗 リンク対応垢数',
    participationStatus: '💌 参加状況',
    lastContactDate: '📅 最終連絡日',
    nextContactDate: '🌸 次回声かけ予定日',
    memberMemo: '📝 メモ・備考'
  };

  confirmContent.replaceChildren();

  Object.keys(registerInputs).forEach(key => {

    const item = document.createElement('div');
    item.className = 'confirm-item';

    const label = document.createElement('strong');
    label.textContent = labels[key];

    const value = document.createElement('p');
    value.textContent = registerInputs[key].value.trim() || '未入力';

    item.appendChild(label);
    item.appendChild(value);

    confirmContent.appendChild(item);
  });
}
// 確認画面へ進むボタン
const goConfirmButton = document.getElementById('goConfirmButton');

goConfirmButton.addEventListener('click', () => {

  // 必須項目の確認
  if (!registerInputs.contactDate.value) {
    alert('声かけ日を入力してください♡');
    registerInputs.contactDate.focus();
    return;
  }

  if (!registerInputs.memberName.value.trim()) {
    alert('お名前を入力してください♡');
    registerInputs.memberName.focus();
    return;
  }

  // 垢数の確認
  if (
    registerInputs.accountCount.value !== '' &&
    (
      !Number.isInteger(Number(registerInputs.accountCount.value)) ||
      Number(registerInputs.accountCount.value) < 0
    )
  ) {
    alert('持ち垢数は0以上の整数で入力してください♡');
    registerInputs.accountCount.focus();
    return;
  }

  if (
    registerInputs.linkAccountCount.value !== '' &&
    (
      !Number.isInteger(Number(registerInputs.linkAccountCount.value)) ||
      registerInputs.accountCount.value === '' ||
      Number(registerInputs.linkAccountCount.value) >
      Number(registerInputs.accountCount.value) ||
      Number(registerInputs.linkAccountCount.value) < 0
    )
  ) {
    alert('リンク対応垢数を確認してください♡');
    registerInputs.linkAccountCount.focus();
    return;
  }

  // 確認画面を表示
  showConfirmContent();
  homeScreen.style.display = 'none';
  registerScreen.style.display = 'none';
  confirmScreen.style.display = 'block';
  window.scrollTo(0, 0);
});
// 確認画面から入力画面に戻る
function backToRegister() {
  confirmScreen.style.display = 'none';
  registerScreen.style.display = 'block';
  window.scrollTo(0, 0);
}

// 修正するボタン
editRegisterButton.addEventListener('click', backToRegister);

// 入力画面に戻るボタン
backRegisterButton.addEventListener('click', backToRegister);
// 声かけ日を最終連絡日に自動入力
const contactDate = document.getElementById('contactDate');
const lastContactDate = document.getElementById('lastContactDate');

contactDate.addEventListener('change', () => {
  if (lastContactDate.value === '') {
    lastContactDate.value = contactDate.value;
  }
});
// 持ち垢数とリンク対応垢数の入力チェック
const accountCount = document.getElementById('accountCount');
const linkAccountCount = document.getElementById('linkAccountCount');

function checkAccountCount() {
  const total = accountCount.value;
  const link = linkAccountCount.value;

  linkAccountCount.setCustomValidity('');

  if (link === '') return;

  if (total === '') {
    linkAccountCount.setCustomValidity(
      '先に持ち垢数を入力してください♡'
    );
  } else if (Number(link) > Number(total)) {
    linkAccountCount.setCustomValidity(
      'リンク対応垢数は持ち垢数以下にしてください♡'
    );
  }

  if (!linkAccountCount.validity.valid) {
    linkAccountCount.reportValidity();
  }
}

accountCount.addEventListener('input', checkAccountCount);
linkAccountCount.addEventListener('input', checkAccountCount);
  const bottomNav = document.querySelector('.bottom-nav');

// 新規登録画面を開く
newRegisterButton.addEventListener('click', () => {
  homeScreen.style.display = 'none';
  registerScreen.style.display = 'block';
  bottomNav.style.display = 'none';
  window.scrollTo(0, 0);
});

// ホーム画面に戻る
backHomeButton.addEventListener('click', () => {
  registerScreen.style.display = 'none';
  homeScreen.style.display = 'block';
  bottomNav.style.display = 'grid';
  window.scrollTo(0, 0);
});
</script>
