
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff1f6">
<title>メンバー募集管理 ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 16px 40px;
  background: linear-gradient(160deg, #fff5f8, #fffafd);
  color: #66515b;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.container {
  max-width: 520px;
  margin: auto;
}

header {
  text-align: center;
  padding: 24px 10px;
}

header h1 {
  color: #c47796;
  font-size: 25px;
  margin: 0 0 8px;
}

header p {
  font-size: 13px;
  color: #a88b98;
}

.card {
  background: #ffffff;
  border: 1px solid #f5dce6;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 4px 14px rgba(190, 130, 155, 0.08);
}

.card h2 {
  color: #bd7895;
  font-size: 17px;
  margin: 0 0 16px;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.stat {
  background: #fff2f6;
  border-radius: 16px;
  padding: 17px 10px;
  text-align: center;
}

.stat-label {
  font-size: 12px;
  color: #a77e90;
}

.stat-number {
  font-size: 27px;
  font-weight: bold;
  color: #c47796;
  margin-top: 5px;
}

.menu-button {
  width: 100%;
  padding: 15px;
  margin: 6px 0;
  border: none;
  border-radius: 14px;
  background: #fce8ef;
  color: #a95f7e;
  font-size: 15px;
  font-weight: bold;
  text-align: left;
}

.menu-button.primary {
  background: #d991ad;
  color: white;
  text-align: center;
}

footer {
  text-align: center;
  color: #c5a4b2;
  font-size: 11px;
  margin-top: 28px;
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>🎀 メンバー募集管理 ♡</h1>
  <p>声をかけたメンバーをかわいく管理</p>
</header>

<div class="card">
  <h2>💗 メンバー状況</h2>
  <div class="stats">
    <div class="stat">
      <div class="stat-label">登録人数</div>
      <div class="stat-number" id="totalCount">0 人</div>
    </div>
    <div class="stat">
      <div class="stat-label">検討中・返事待ち</div>
      <div class="stat-number" id="pendingCount">0 人</div>
    </div>
  </div>
</div>

<div class="card">
  <h2>🌷 メニュー</h2>

  <button class="menu-button primary">
    ＋ 新しい人を登録する
  </button>

  <button class="menu-button">
    ♡ 登録メンバー一覧
  </button>

  <button class="menu-button">
    🔍 メンバーを検索する
  </button>

  <button class="menu-button">
    📋 データを出力する
  </button>
</div>

<footer>
  Member Recruit Manager ♡
</footer>

</div>
</body>
</html>
